services:
  scylla:
    image: scylladb/scylla:6.2.3
    command:
      - --smp=1
      - --memory=1G
      - --overprovisioned=1
      - --developer-mode=1
    ports:
      - "127.0.0.1:9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    networks:
      - tournament
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT release_version FROM system.local"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  backend:
    image: technical-exam-backend:local
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      SCYLLA_CONTACT_POINTS: scylla
      SCYLLA_LOCAL_DATACENTER: datacenter1
      PASTE_FETCH_MODE: ${PASTE_FETCH_MODE:-live}
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - tournament
    depends_on:
      scylla:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: technical-exam-frontend:local
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    environment:
      API_BASE_URL: http://backend:3001
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tournament
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  scylla-data:

networks:
  tournament:
